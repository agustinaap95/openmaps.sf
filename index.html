<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>openmaps.sf - San Francisco, Córdoba</title>

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .popup-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    .popup-table th {
      text-align: left;
      padding: 4px 8px 4px 0;
      color: #555;
      border-bottom: 1px solid #eee;
    }
    .popup-table td {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Iniciar el mapa centrado en San Francisco, Córdoba
    const map = L.map('map').setView([-31.4279, -62.0827], 13);

    // 2. Mapa base limpio que no bloquea peticiones
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri &mdash; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

    // 3. Cargar y dibujar el archivo puntos.geojson
    fetch('puntos.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se encontró el archivo puntos.geojson');
        }
        return response.json();
      })
      .then(data => {
        const capaPuntos = L.geoJSON(data, {
          // Estilo de los puntos (círculos)
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 8,
              fillColor: '#e67e22',
              color: '#ffffff',
              weight: 2,
              opacity: 1,
              fillOpacity: 0.9
            });
          },
          // Armar el globo (popup) con todas las columnas de tu tabla de QGIS
          onEachFeature: function (feature, layer) {
            if (feature.properties) {
              let filas = '';
              for (const [clave, valor] of Object.entries(feature.properties)) {
                if (valor !== null && valor !== '') {
                  filas += `<tr><th>${clave}</th><td>${valor}</td></tr>`;
                }
              }
              if (filas) {
                layer.bindPopup(`<table class="popup-table">${filas}</table>`);
              }
            }
          }
        }).addTo(map);

        // Ajustar el zoom automáticamente para encuadrar todos tus puntos
        if (capaPuntos.getBounds().isValid()) {
          map.fitBounds(capaPuntos.getBounds(), { padding: [30, 30] });
        }
      })
      .catch(error => {
        console.error('Error cargando GeoJSON:', error);
        alert('No se pudo cargar puntos.geojson. Verifica que esté subido en la misma carpeta que index.html.');
      });
  </script>

</body>
</html>
