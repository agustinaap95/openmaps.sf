        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-31.477785865232914,-62.1353892544209],[-31.393715432846758,-62.00962763236396]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_ESRISatellite_0');

        function pop_Datos_varioscentros_vecinales_san_fco_4(feature, layer) {
            var popupContent = '<table>\

                    </tr>\

                    </tr>\
                    <tr>\
                        <th scope="row">addr:housenumber</th>\
                        <td class="visible-with-data" id="addr:housenumber">' + (feature.properties['addr:housenumber'] !== null ? autolinker.link(String(feature.properties['addr:housenumber']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['addr:country'] !== null ? autolinker.link(String(feature.properties['addr:country']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['addr:city'] !== null ? autolinker.link(String(feature.properties['addr:city']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Datos_varioscentros_vecinales_san_fco_4_0() {
            return {
                pane: 'pane_Datos_varioscentros_vecinales_san_fco_4',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',

                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(254,220,102,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_Datos_varioscentros_vecinales_san_fco_4');
        map.getPane('pane_Datos_varioscentros_vecinales_san_fco_4').style.zIndex = 404;
        map.getPane('pane_Datos_varioscentros_vecinales_san_fco_4').style['mix-blend-mode'] = 'normal';
        var layer_Datos_varioscentros_vecinales_san_fco_4 = new L.geoJson(json_Datos_varioscentros_vecinales_san_fco_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Datos_varioscentros_vecinales_san_fco_4',
            layerName: 'layer_Datos_varioscentros_vecinales_san_fco_4',
            pane: 'pane_Datos_varioscentros_vecinales_san_fco_4',
            onEachFeature: pop_Datos_varioscentros_vecinales_san_fco_4,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,

                return L.circleMarker(latlng, style_Datos_varioscentros_vecinales_san_fco_4_0(feature));
            },
        });
        bounds_group.addLayer(layer_Datos_varioscentros_vecinales_san_fco_4);
        map.addLayer(layer_Datos_varioscentros_vecinales_san_fco_4);
        var overlaysTree = [
            {label: '<img src="legend/Datos_varioscentros_vecinales_san_fco_4.png" /> Datos_varios — centros_vecinales_san_fco', layer: layer_Datos_varioscentros_vecinales_san_fco_4},
            {label: "OpenStreetMap", layer: layer_OpenStreetMap_3},

            {label: "ESRI Satellite", layer: layer_ESRISatellite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
